<svg width="720" height="320" viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Very subtle softness (NOT gooey merge) -->
    <filter id="soft">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Premium gradients -->
    <radialGradient id="g1" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ebe4ff"/>
      <stop offset="100%" stop-color="#cfc3ff"/>
    </radialGradient>

    <radialGradient id="g2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f7f4ff"/>
      <stop offset="100%" stop-color="#ded6ff"/>
    </radialGradient>
  </defs>

  <!-- Big central blob -->
  <circle cx="360" cy="160" r="110" fill="url(#g1)" filter="url(#soft)">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="-20 -10"
      to="20 10"
      dur="20s"
      repeatCount="indefinite"
      direction="alternate"/>
  </circle>

  <!-- Left blob -->
  <circle cx="190" cy="170" r="75" fill="url(#g2)" filter="url(#soft)">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="15 -15"
      to="-15 15"
      dur="24s"
      repeatCount="indefinite"
      direction="alternate"/>
  </circle>

  <!-- Right blob -->
  <circle cx="530" cy="150" r="65" fill="url(#g1)" filter="url(#soft)">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="-10 20"
      to="10 -20"
      dur="26s"
      repeatCount="indefinite"
      direction="alternate"/>
  </circle>
</svg>